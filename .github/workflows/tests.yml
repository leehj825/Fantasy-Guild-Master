name: Tests

# Fast logic tests (expedition scripts, dive, relics, translation). No browser or build needed.
on:
  push:
    paths: ['src/**', 'tests/**', 'package.json', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f" || exit 1; done
