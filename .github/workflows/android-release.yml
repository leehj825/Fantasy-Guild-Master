name: Android release (signed AAB + APK)

# Builds the RELEASE version of the app: it uses the real AdMob ad units (the debug APK uses Google's test units).
# Run it by hand (Actions > Android release > Run workflow) after adding these repository secrets:
#   ANDROID_KEYSTORE_BASE64   the upload keystore file, base64 encoded  (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# The signed .aab (for Google Play) and .apk are attached to a pre-release named release-<run number>.
# Never click your own live ads while testing: install the debug APK for that.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 (and password / alias) repository secrets first. See the comment at the top of this workflow."; exit 1; fi

      - name: Restore the keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed bundle and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/*.aab "out/fantasy-guild-master-${TAG}.aab"
          cp android/app/build/outputs/apk/release/*.apk "out/fantasy-guild-master-${TAG}.apk"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Release build ${GITHUB_RUN_NUMBER}" --notes "Signed release build from ${GITHUB_SHA::7}. Uses the real AdMob ad units."
          gh release upload "$TAG" out/* --clobber
