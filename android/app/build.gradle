plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.leehj825.fantasyguildmaster'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.leehj825.fantasyguildmaster'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game is the plain web files at the repository root. They are copied (not duplicated in git) into
    // the app's assets under www/ before every build, and served to the WebView from a https:// origin.
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/www'))
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.2.0'            // AdMob: banner + rewarded ads
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'       // consent form (GDPR / EEA, UK)
}

def webRoot = rootProject.projectDir.parentFile
tasks.register('copyWeb', Copy) {
    from(webRoot) {
        include 'index.html', 'style.css', 'src/**', 'vendor/**'
    }
    into layout.buildDirectory.dir('generated/www/www')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyWeb' }
