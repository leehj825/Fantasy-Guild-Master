<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fantasy Guild Master</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="world"></div>

<div id="topbar">
  <div class="pill" title="Gold">💰 <b id="hGold">0</b></div>
  <div class="pill" title="Guild Renown">⭐ <b id="hRenown">0</b></div>
  <div class="pill" title="Mana">✨ <b id="hMana">0</b></div>
  <div class="pill" title="Heroes / Population capacity">🛡️ <b id="hPop">0/0</b></div>
  <div class="pill" id="seasonPill" title="Season" style="cursor:pointer"><b id="hSeason"></b></div>
  <div class="pill" id="inboxPill" title="Inbox: stories, events and requests waiting for you" style="cursor:pointer">📬<b id="hInbox">0</b></div>
  <div class="pill" id="readyPill" title="Ready heroes / open quests (tap for the quest board)" style="cursor:pointer">✅<b id="hReady">0</b> 📜<b id="hOpen">0</b></div>
  <div class="pill mats" title="Ore / Wood / Herbs">⛏️<b id="hOre">0</b> 🪵<b id="hWood">0</b> 🌿<b id="hHerbs">0</b></div>
  <div class="pill hidden" id="hRare" title="Rare materials: Mythril / Dragon Scales / Phoenix Feathers">💎<b id="hMyth">0</b> 🐉<b id="hScale">0</b> 🪶<b id="hFeather">0</b></div>
  <div class="pill hidden" id="hIngot" title="Ingots (Smeltery)">🔩<b id="hIng">0</b></div>
  <div class="pill" id="speedBtn" title="Game speed">⏵ x1</div>
  <div class="pill" id="settingsBtn" title="Settings & save" style="cursor:pointer">⚙</div>
</div>

<div id="objectives"><button id="objToggle" title="Hide / show the goals panel" aria-label="Toggle goals panel">▾</button><h4>Guild Quests:</h4><ul id="objList"></ul><div id="expeds"></div><div id="royal"></div></div>

<div id="camctl">
  <button id="camLeft" title="Rotate left (←)">⟲</button><button id="camRight" title="Rotate right (→)">⟳</button>
  <button id="camUp" title="Tilt up (↑)">⤒</button><button id="camDown" title="Tilt down (↓)">⤓</button>
  <button id="camIn" title="Zoom in (+)">＋</button><button id="camOut" title="Zoom out (−)">－</button>
  <button id="camReset" title="Reset view (Home)">⌂</button>
</div>

<div id="stageEl"></div>
<div id="watchBar">
  <div class="wtop"><b id="wName"></b><span id="wPhase"></span></div>
  <div class="wbar"><i id="wProg"></i><u style="left:10%"></u><u style="left:36%"></u><u style="left:62%"></u><u style="left:90%"></u></div>
  <div id="wParty"></div><div id="wSwitch"></div>
</div>
<div id="watchLog"></div>
<div id="pipFrame"><span>🏠 Base · tap to return</span></div>
<div id="watchActs">
  <div id="wHint"></div>
  <div class="wrow"><button class="act hidden" id="wRelic" style="background:linear-gradient(#b070ff,#6a2da5);color:#fff">🎁 Choose relic</button><button class="act" id="wEnchant">✨ Enchant</button><button class="act" id="wPotion">🧪 Potion</button><button class="act red" id="wRecall">🏳 Recall</button></div>
  <div class="wrow" id="wSkills"></div>
  <div class="wrow"><button class="act" id="wFollow">🎯 Follow</button><button class="act" id="wPipBtn">🖼 Base view</button><button class="act" id="wSpeed">⏵ x1</button><button class="act" id="wBack">🏠 Back to base</button></div>
</div>
<div id="tutorial" class="hidden"><div class="tt"><b id="tutStep"></b><button id="tutSkip">Skip</button></div><div id="tutText"></div></div>

<div id="banner" class="hidden"></div>
<div id="toasts"></div>
<div id="placeHint" class="hidden">Drag the golden plot (or tap the ground) to move it · rotate with ⟲ ⟳ · then confirm</div>
<div id="placeBar" class="hidden">
  <div class="pname"><b id="placeName"></b> <span class="tag">💰 <span id="placeCost"></span></span></div>
  <div class="pbtns"><button class="act" id="placeL" title="Rotate left">⟲ Rotate</button><button class="act" id="placeR" title="Rotate right (R)">Rotate ⟳</button>
  <button class="act" id="placeOk" title="Build here (Enter)">✔ Build</button><button class="act red" id="placeNo" title="Cancel (Esc)">✖ Cancel</button></div>
</div>

<div id="toolbar">
  <button data-open="build"><span>🔨</span>Build</button>
  <button data-open="quests"><span>📜</span>Quests</button>
  <button data-open="map"><span>🗺</span>Map</button>
  <button data-open="recruit"><span>🛡️</span>Recruit</button>
  <button data-open="research"><span>⚗️</span>Research</button>
  <button data-open="upgrades"><span>⬆️</span>Upgrades</button>
</div>

<div id="modal" class="hidden">
  <div id="modalBox">
    <button id="modalClose">✕</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
